# Gera o app Android do RASTRO (APK) e publica em Releases.
# Link fixo para baixar sempre a versão mais nova:
#   https://github.com/2MDevs/Rastro/releases/latest/download/rastro.apk
name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura (segredos do repositório)
        env:
          KEYSTORE_B64: ${{ secrets.RASTRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rastro.jks"
            echo "RASTRO_KEYSTORE_FILE=$RUNNER_TEMP/rastro.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave oficial do RASTRO."
          else
            echo "::warning::Chave oficial não configurada: o APK sai assinado com chave de teste (cada versão pede para desinstalar a anterior). Veja docs/app-android.md."
          fi

      - name: Gerar APK
        working-directory: android
        env:
          RASTRO_BASE_URL: https://rastro.gestaohummm.com.br
          RASTRO_VERSION_CODE: ${{ github.run_number }}
          RASTRO_KEYSTORE_PASSWORD: ${{ secrets.RASTRO_KEYSTORE_PASSWORD }}
          RASTRO_KEY_ALIAS: ${{ secrets.RASTRO_KEY_ALIAS }}
          RASTRO_KEY_PASSWORD: ${{ secrets.RASTRO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/rastro.apk"
          sha256sum "$RUNNER_TEMP/rastro.apk" | cut -d' ' -f1 > "$RUNNER_TEMP/rastro.apk.sha256"

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: RASTRO para Android 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            App Android do RASTRO (registro do percurso com a tela apagada).
            Baixar: https://github.com/2MDevs/Rastro/releases/latest/download/rastro.apk
            Conferência (SHA-256): veja o arquivo rastro.apk.sha256.
          files: |
            ${{ runner.temp }}/rastro.apk
            ${{ runner.temp }}/rastro.apk.sha256
